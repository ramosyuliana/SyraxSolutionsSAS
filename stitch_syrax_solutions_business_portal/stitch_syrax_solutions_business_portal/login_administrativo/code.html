<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm text-center">Sign in to your Syrax Admin account to manage enterprise services.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-[#F1F5F9] border-none py-md pl-12 pr-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:outline-none transition-shadow rounded-full" id="email" placeholder="admin@syrax.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-[#F1F5F9] border-none py-md pl-12 pr-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:outline-none transition-shadow rounded-full" id="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-xs cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 rounded border border-outline-variant bg-surface-container-lowest group-hover:border-primary transition-colors">
<input class="peer opacity-0 absolute inset-0 cursor-pointer w-full h-full" type="checkbox">
<span class="material-symbols-outlined text-[16px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant text-[14px]">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-md px-xl rounded-full hover:bg-primary hover:text-on-primary transition-colors duration-200 mt-md shadow-sm active:scale-[0.98]" type="submit">
                Login
            </button><div class="text-center mt-md">
